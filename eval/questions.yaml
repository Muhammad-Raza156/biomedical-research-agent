# answer_kind: pmid → compare cited PMIDs; text → substring match of each gold item in the answer text
- id: t1-authors-by-title
  tier: 1
  question: "Who are the authors of the paper titled 'Diabetes, metformin and breast cancer: a tangled web'?"
  answer_kind: text
  gold_cypher: |
    MATCH (a:Author)-[:AUTHORED]->(p:Paper) WHERE p.title STARTS WITH 'Diabetes, metformin and breast cancer'
    RETURN a.display_name AS answer
- id: t1-journal-retraction
  tier: 1
  question: "Which journal published PMID 35269852, and has it been retracted?"
  answer_kind: text
  gold_cypher: |
    MATCH (p:Paper {pmid: '35269852'})-[:PUBLISHED_IN]->(j:Journal)
    RETURN j.title AS answer UNION RETURN 'retracted' AS answer
- id: t1-journal-most-cited
  tier: 1
  question: "Which journal published PMID 19564453?"
  answer_kind: text
  gold_cypher: "MATCH (:Paper {pmid: '19564453'})-[:PUBLISHED_IN]->(j:Journal) RETURN j.title AS answer"

# Narrow terms on purpose: liver (325 co-authors) and all digestive neoplasms (99 papers) made recall a
# measure of list length, not correctness.
- id: t2-coauthors-ovarian
  tier: 2
  question: "Which authors have co-authored with someone who published on ovarian neoplasms?"
  answer_kind: text
  gold_cypher: |
    MATCH (:MeshTerm {name: 'Ovarian Neoplasms'})<-[:MENTIONS]-(:Paper)<-[:AUTHORED]-(x:Author)
    MATCH (x)-[:AUTHORED]->(:Paper)<-[:AUTHORED]-(co:Author) WHERE co <> x AND NOT co.collective
    RETURN DISTINCT co.display_name AS answer
- id: t2-journals-citing
  tier: 2
  question: "List the journals that published papers citing PMID 19564453."
  answer_kind: text
  gold_cypher: |
    MATCH (c:Paper)-[:CITES]->(:Paper {pmid: '19564453'}), (c)-[:PUBLISHED_IN]->(j:Journal)
    RETURN DISTINCT j.title AS answer
- id: t2-head-neck-descendants
  tier: 2
  question: "Which papers mention any kind of head and neck neoplasm?"
  answer_kind: pmid
  gold_cypher: |
    MATCH (p:Paper)-[:MENTIONS]->(:MeshTerm)-[:BROADER*0..]->(:MeshTerm {name: 'Head and Neck Neoplasms'})
    RETURN DISTINCT p.pmid AS answer

- id: t3-chemicals-breast-before-after
  tier: 3
  question: "Which chemical (MeSH D-tree) terms appear in papers about breast neoplasms before 2016, and which only after?"
  answer_kind: text
  gold_cypher: |
    MATCH (p:Paper)-[:MENTIONS]->(:MeshTerm {name: 'Breast Neoplasms'}), (p)-[:MENTIONS]->(c:MeshTerm)
    WHERE 'D' IN c.categories
    WITH c.name AS term, min(p.pub_year) AS first
    // plain names so substring scoring can find them; the before/only-after split is checked by hand in EVAL.md
    RETURN term AS answer
- id: t3-chain-to-colorectal
  tier: 3
  question: "Find a citation chain from PMID 41178701 to any paper mentioning colorectal neoplasms, ordered by publication date."
  answer_kind: pmid
  gold_cypher: |
    MATCH path = (:Paper {pmid: '41178701'})-[:CITES*1..4]->(b:Paper)
    WHERE EXISTS { (b)-[:MENTIONS]->(:MeshTerm {name: 'Colorectal Neoplasms'}) }
    WITH path ORDER BY length(path) LIMIT 1
    UNWIND nodes(path) AS n RETURN n.pmid AS answer
- id: t3-liver-before-colorectal
  tier: 3
  question: "Which authors published on liver neoplasms before they first published on colorectal neoplasms?"
  answer_kind: text
  gold_cypher: |
    MATCH (a:Author)-[:AUTHORED]->(p:Paper)-[:MENTIONS]->(:MeshTerm {name: 'Liver Neoplasms'})
    WITH a, min(p.pub_year) AS liver
    MATCH (a)-[:AUTHORED]->(q:Paper)-[:MENTIONS]->(:MeshTerm {name: 'Colorectal Neoplasms'})
    WITH a, liver, min(q.pub_year) AS colorectal WHERE liver < colorectal
    RETURN a.display_name AS answer

- id: adv-false-premise
  tier: adversarial
  kind: false_premise
  question: "Why did PMID 16443869 cite PMID 41178701?"
- id: adv-nonexistent-pmid
  tier: adversarial
